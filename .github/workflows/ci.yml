name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: --help works
        shell: bash
        run: |
          exe=target/release/zyrik
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --help --lang en | grep -- --key
          "$exe" --help --lang ru | grep -- --save-dir

  windows-gnu:
    # так собирается релиз: со значком и сведениями о версии (windres)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --locked --target x86_64-pc-windows-gnu
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: zyrik-windows
          path: target/x86_64-pc-windows-gnu/release/zyrik.exe

  linux-x11:
    # T047: сценарий под Xvfb + strace — запись на диск только в сохранённые снимки,
    # соединения только AF_UNIX (принцип I)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip strace x11-utils x11-xkb-utils
      - run: SRC=$GITHUB_WORKSPACE bash tools/linux-test/run.sh

  wayland-sway:
    # фаза 5: Sway без экрана — захват wlr-screencopy, окно layer-shell, буфер data-control, --trigger
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y sway wtype wl-clipboard grim strace dbus-x11
      - run: cargo build --release --locked --bin zyrik --example wl_mouse
      - run: mkdir -p bin && cp target/release/zyrik target/release/examples/wl_mouse bin/
      - run: sudo mkdir -p /out && sudo chmod 777 /out
      - run: ZYRIK_BIN=$PWD/bin XDG_RUNTIME_DIR=$(mktemp -d) bash tools/wayland-test/run.sh sway

  macos-app:
    # D7: Зырик.app в zip; дымовая проверка на macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tools/macos/bundle.sh
      - name: Smoke test
        run: bash tools/macos/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zyrik-macos
          path: target/macos/Zyrik-macos.zip

  ocr:
    # фаза 6: встроенный Tesseract (фича ocr) на трёх ОС; на Linux — ещё и под strace (T072)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ZYRIK_OCR_LIB: ${{ github.workspace }}/target/ocr/install/lib
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build strace xvfb
      - if: runner.os == 'macOS'
        run: brew install ninja
      - id: ocrkey
        run: echo "key=ocr-${{ matrix.target }}-$(git rev-parse --short HEAD:third_party/tesseract)-$(git rev-parse --short HEAD:third_party/leptonica)-$(git hash-object tools/ocr-build.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/ocr/install
          key: ${{ steps.ocrkey.outputs.key }}
      - name: Build Tesseract
        run: |
          if [ ! -d target/ocr/install/lib ]; then
            if [ "$RUNNER_OS" = Windows ]; then export CC=gcc CXX=g++; fi
            bash tools/ocr-build.sh
          fi
      - run: cargo test --locked --release --features ocr --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: bash tools/ocr-no-disk.sh
      - run: cargo build --locked --release --features ocr --target ${{ matrix.target }}
      - run: ls -la target/${{ matrix.target }}/release/zyrik*
      - name: SC-007 idle CPU and memory
        run: |
          exe=target/${{ matrix.target }}/release/zyrik
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a bash tools/idle.sh "$exe"; else bash tools/idle.sh "$exe"; fi

  offline:
    # Принцип I: в программе нет сети. Проверяем код и дерево зависимостей.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No network APIs in the code
        shell: bash
        run: |
          if grep -RInE 'TcpStream|TcpListener|UdpSocket|ToSocketAddrs|reqwest|hyper::|ureq|WinHttp|InternetOpen|HttpClient|WSAStartup|URLSession|NSURL|CFNetwork|libcurl' src build.rs Cargo.toml; then
            echo "network API is not allowed"
            exit 1
          fi
      - name: No network crates in the dependency tree
        shell: bash
        run: |
          tree=$(cargo tree --locked --target all -e normal,build --prefix none)
          echo "$tree"
          if echo "$tree" | grep -E '^(reqwest|hyper|ureq|curl|native-tls|rustls|tokio|mio|socket2|h2|http) '; then
            echo "network crate is not allowed"
            exit 1
          fi
