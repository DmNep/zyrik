"about.text" = """
Zyrik {version} — screenshots that never leak.

• Never touches the network.
• Writes nothing to disk except the file you save with Ctrl+S.
• Puts the shot on the clipboard marked "no history, no cloud".
• Keeps no settings on disk — only the options in the shortcut.

Snap: {key}.
Launch options: "{program}" --help"""

