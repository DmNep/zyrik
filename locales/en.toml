"help.text" = """
Zyrik {version} — screenshots that never leak.

Usage: zyrik [options]

  --key <keys>              snap a region (default {default_key})
  --key-screen <keys>       snap the whole monitor (unassigned by default)
  --key-window <keys>       snap the active window (unassigned by default)
  --save-dir <folder>       where Ctrl+S saves (default: Pictures)
  --clear-clipboard <min>   clear the clipboard after this many minutes if the shot is still there
  --no-detect               do not look for private data on the shot
  --lang <{langs}>            language (default: system language, else en)
  --help                    this help

Keys: modifiers Ctrl, Alt, Shift, {meta} joined with "+" and one key —
PrtScr, Pause, ScrollLock, Insert, Delete, Home, End, PageUp, PageDown,
F1…F24, A…Z, 0…9. Letters and digits need a modifier.

Settings are stored nowhere. Windows shortcut, "Target" field:
"{program}" --key Shift+PrtScr --save-dir "D:\\Shots"
"""
