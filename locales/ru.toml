"help.text" = """
Зырик {version} — снимки экрана, которые никуда не утекают.

Запуск: zyrik [параметры]

  --key <клавиши>           зырнуть область (по умолчанию {default_key})
  --key-screen <клавиши>    зырнуть весь монитор (по умолчанию не назначена)
  --key-window <клавиши>    зырнуть активное окно (по умолчанию не назначена)
  --save-dir <папка>        куда сохранять по Ctrl+S (по умолчанию «Изображения»)
  --clear-clipboard <мин>   очистить буфер через столько минут, если там всё ещё снимок
  --no-detect               не искать на снимке приватные данные
  --lang <{langs}>            язык (по умолчанию язык системы, иначе en)
  --help                    эта справка

Клавиши: модификаторы Ctrl, Alt, Shift, {meta} через «+» и одна клавиша —
PrtScr, Pause, ScrollLock, Insert, Delete, Home, End, PageUp, PageDown,
F1…F24, A…Z, 0…9. Буквы и цифры — только с модификатором.

Настройки нигде не хранятся. Ярлык Windows, поле «Объект»:
"{program}" --key Shift+PrtScr --save-dir "D:\\Снимки"
"""
